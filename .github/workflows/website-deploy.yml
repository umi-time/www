name: Deploy Website to GitHub Pages

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:         # Prevents race conditions and site state corruption
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: 'recursive' # For spec submodule

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'           # Caches npm dependencies for faster builds

      - name: Install Dependencies
        run: npm ci              # Installs dependencies with a clean slate for deterministic builds

      - name: Build Production Assets
        run: npm run build       # Builds the project

      - name: Setup GitHub Pages Environment
        uses: actions/configure-pages@v5 # Configures the GitHub Pages environment

      - name: Package Static HTML/CSS/JS Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages Live Environment
        id: deployment           # Captures deployment output for the environment URL
        uses: actions/deploy-pages@v4
